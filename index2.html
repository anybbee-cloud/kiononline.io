<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@100..900&display=swap" rel="stylesheet">
<title>ລາຍຈ່າຍ + Total</title>

<style>
body{margin:0;font-family:"Noto Sans Lao",system-ui;background:#f5f6fa;color:#111;padding:22px}
h2{color:#333}
table{width:100%;border-collapse:collapse;margin-top:10px;box-shadow:0 3px 10px rgba(0,0,0,.1);border-radius:8px;overflow:hidden;background:#fff}
th,td{border:1px solid #9c9c9c;padding:10px;text-align:center}
th{background:linear-gradient(90deg,#5ce4e7,#07a8ff);color:#fff;font-weight:bold}
td[contenteditable]{background:#fff;border-radius:4px;min-width:60px}
tfoot td{font-weight:bold;background:#dfe6e9}
button{cursor:pointer;padding:6px 12px;border:none;border-radius:6px;background:#0984e3;color:#fff}
button:hover{background:#74b9ff}
.addRowBtn{margin-top:10px;background:#00b894}
.clearBtn{margin-top:10px;background:#d63031}
#goHome{margin-bottom:15px;background:#009f95}
#goHome:hover{background:#ff0000}
</style>
</head>

<body>

<button id="goHome">🏠 ກັບໄປ Home</button>

<h2>ລາຍຈ່າຍ (ONLINE)</h2>
<table class="expenseTable" data-id="online">
<thead>
<tr>
  <th>#</th>
  <th>ວັນທີ / ເວລາ</th>
  <th>ລາຍການ</th>
  <th>ຈຳນວນເງິນ</th>
  <th>Action</th>
</tr>
</thead>
<tbody></tbody>
<tfoot>
<tr>
  <td colspan="3">Total</td>
  <td class="totalAmount">0</td>
  <td></td>
</tr>
</tfoot>
</table>

<button class="addRowBtn">➕ ເພີ່ມແຖວ</button>

<h2>Grand Total</h2>
<div id="grandTotal" style="font-size:20px;font-weight:bold">0</div>

<button id="clearAll" class="clearBtn">🧹 ລ້າງຂໍ້ມູນ</button>
<button id="sendWhatsapp" style="margin-top:15px;background:#25d366;font-size:16px">
📤 ສົ່ງໄປ WhatsApp
</button>

<script>
/* ======================
   Navigation
====================== */
document.getElementById('goHome').onclick=()=>location.href='index.html'

/* ======================
   Helpers (ของเดิม)
====================== */
function getKey(){ return 'expense_online' }
function nowText(){
  const d=new Date()
  const day=String(d.getDate()).padStart(2,'0')
  const month=String(d.getMonth()+1).padStart(2,'0')
  const year=d.getFullYear()
  const h=String(d.getHours()).padStart(2,'0')
  const m=String(d.getMinutes()).padStart(2,'0')
  return `${day}/${month}/${year} ${h}:${m}`
}
function parseNum(t){
  const n=parseInt(t.replace(/,/g,''))
  return isNaN(n)?0:n
}

/* ======================
   Table Logic
====================== */
const table=document.querySelector('.expenseTable')
const tbody=table.querySelector('tbody')

function addRow(index,data={}){
  const tr=document.createElement('tr')
  tr.innerHTML=`
    <td>${index}</td>
    <td class="date">${data.date||'--/--/---- --:--'}</td>
    <td contenteditable class="remark">${data.remark||'ລາຍການ '+index}</td>
    <td contenteditable class="amount">${data.amount||'0'}</td>
    <td><button class="del">🗑</button></td>
  `
  tbody.appendChild(tr)
}

/* ======================
   Load
====================== */
const saved=JSON.parse(localStorage.getItem(getKey()))||[]
if(saved.length){
  saved.forEach((r,i)=>addRow(i+1,r))
}else addRow(1)
updateTotal()

/* ======================
   Events
====================== */
document.querySelector('.addRowBtn').onclick=()=>{
  addRow(tbody.children.length+1)
  save()
  updateTotal()
}

document.body.addEventListener('click',e=>{
  if(e.target.classList.contains('del')){
    e.target.closest('tr').remove()
    Array.from(tbody.children).forEach((tr,i)=>tr.children[0].textContent=i+1)
    save()
    updateTotal()
  }
})

/* ===== INPUT (ของเดิม + กันพัง) ===== */
document.body.addEventListener('input',e=>{
  const tr=e.target.closest('tr')
  if(!tr) return

  if(
    e.target.classList.contains('remark') ||
    e.target.classList.contains('amount')
  ){
    tr.querySelector('.date').textContent=nowText()
  }

  

  save()
  updateTotal()
})

document.body.addEventListener('blur',e=>{
  if(e.target.classList.contains('amount')){
    const v=parseNum(e.target.textContent)
    e.target.textContent=v.toLocaleString()
    save()
    updateTotal()
  }
},true)

/* ======================
   Calculate / Save
====================== */
function updateTotal(){
  let total=0
  tbody.querySelectorAll('.amount').forEach(td=>{
    total+=parseNum(td.textContent)
  })
  table.querySelector('.totalAmount').textContent=total.toLocaleString()
  document.getElementById('grandTotal').textContent=total.toLocaleString()

  // sync ไป INDEX.HTML
  localStorage.setItem('expense_from_index2', total)
}

function save(){
  const data=[]
  tbody.querySelectorAll('tr').forEach(tr=>{
    data.push({
      date:tr.querySelector('.date').textContent,
      remark:tr.querySelector('.remark').textContent,
      amount:tr.querySelector('.amount').textContent
    })
  })
  localStorage.setItem(getKey(),JSON.stringify(data))
}

/* ======================
   Clear
====================== */
document.getElementById('clearAll').onclick=()=>{
  if(confirm('ຢືນຢັນລ້າງຂໍ້ມູນ?')){
    localStorage.clear()
    location.reload()
  }
}

/* ======================
   WhatsApp (ของเดิม)
====================== */
document.getElementById('sendWhatsapp').onclick = () => {
  let msg = " ລາຍງານຄ່າໃຊ້ຈ່າຍ\n\n";

  msg += "🛒 ລາຍຈ່າຍ (ONLINE)\n";

  document.querySelectorAll('.expenseTable tbody tr').forEach(tr => {
    const date = tr.querySelector('.date').textContent;
    const remark = tr.querySelector('.remark').textContent;
    const amountEl = tr.querySelector('.amount');
    const amount = amountEl.value ?? amountEl.textContent;

    msg += `-  ${date} | ${remark} =  ${amount}\n`;
  });

  const total = document.querySelector('.totalAmount').textContent;
  msg += `\n Total: ${total}\n`;

  

  window.open(
    "https://wa.me/?text=" + encodeURIComponent(msg),
    "_blank"
  );
};


</script>

</body>
</html>
